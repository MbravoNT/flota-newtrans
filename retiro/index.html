function wireLogin(){

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad2(n){ return String(n).padStart(2,'0'); }
const hoyISO = () => new Date().toISOString().slice(0,10);
function nowMinutes(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function isFridayToday(){ return new Date().getDay()===5; }
function fmtTime(ts){ if(!ts) return '—'; const d=new Date(ts); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }

function showToast(msg){
  const t = document.getElementById('toast');

/* ============================= DATA LOAD ============================= */
async function cargarTodo(){
  try{
    const fecha = hoyISO();
    const [clientesR, vehiculosR, palletsR, viajesR] = await Promise.all([
      sb.from('retiro_clientes').select('*'),
      sb.from('retiro_vehiculos_efectivo').select('*'),
      sb.from('retiro_pallets_dia').select('*').eq('fecha', fecha),
      sb.from('retiro_viajes').select('*').eq('fecha', fecha).order('hora_inicio',{ascending:true}),
    ]);
    for(const r of [clientesR, vehiculosR, palletsR, viajesR]) if(r.error) throw r.error;
    state.clientes = clientesR.data;
    state.vehiculos = vehiculosR.data.filter(v=>v.estado_efectivo!=='Inactivo').map(v=>({...v, estado_disponibilidad:v.estado_efectivo, motivo:v.motivo_efectivo})); // Inactivo (NTFleet o manual) no se muestra; Mantención sí, como no disponible
    state.pallets = palletsR.data;
    state.viajes = viajesR.data;
    const viajeIds = state.viajes.map(v=>v.id);
    if(viajeIds.length){
      const paradasR = await sb.from('retiro_viaje_paradas').select('*').in('viaje_id', viajeIds);
      if(paradasR.error) throw paradasR.error;
      state.paradas = paradasR.data;
    } else {
      state.paradas = [];
    }
    setLive(true);
    render();
  }catch(e){
    console.error(e);
    setLive(false);
  }
}
function setLive(ok){
  liveOk = ok;
  const dot = document.getElementById('liveDot'); const lbl = document.getElementById('liveLabel');
  if(!dot) return;
  dot.classList.toggle('off', !ok);
  lbl.textContent = ok ? 'en vivo — datos compartidos con el equipo' : 'sin conexión — reintentando…';
}

/* ============================= DOMAIN HELPERS ============================= */
function clienteMap(){ const m={}; state.clientes.forEach(c=>m[c.id]=c); return m; }
function vehiculoMap(){ const m={}; state.vehiculos.forEach(v=>m[v.patente]=v); return m; }
function palletsRow(clienteId){ return state.pallets.find(p=>p.cliente_id===clienteId); }
function pallets(clienteId){ const r=palletsRow(clienteId); return r?r.cantidad:0; }
function coberturaCliente(clienteId){ return state.paradas.filter(p=>p.cliente_id===clienteId).reduce((s,p)=>s+p.cantidad_pallets,0); }
function paradasDeCliente(clienteId){ return state.paradas.filter(p=>p.cliente_id===clienteId); }
function viajesDePatente(patente){ return state.viajes.filter(v=>v.patente===patente); }
function viajeActivoDe(patente){ return state.viajes.find(v=>v.patente===patente && v.estado==='en_curso'); }
function paradasDe(viajeId){ return state.paradas.filter(p=>p.viaje_id===viajeId).sort((a,b)=>a.orden-b.orden); }
function capacidadUsada(viaje){ return paradasDe(viaje.id).reduce((s,p)=>s+p.cantidad_pallets,0); }

function horarioTextoHoy(cliente){ return isFridayToday() ? cliente.horario_v : cliente.horario_lj; }
function parseLastTimeToMinutes(text){
  if(!text) return null;
  const t = String(text).trim();
  if(t==='' || t==='—' || t.toLowerCase()==='sin horario') return null;
  const matches = [...t.matchAll(/(\d{1,2})(?::(\d{2}))?\s*(?:hrs?\.?|horas)?/g)];
  if(!matches.length) return null;
  const last = matches[matches.length-1];
  let h = parseInt(last[1],10); let m = last[2]?parseInt(last[2],10):0;
  if(isNaN(h)||h>23||m>59) return null;
  return h*60+m;
}
function getIndicator1(cliente){
  const deadlineMin = parseLastTimeToMinutes(horarioTextoHoy(cliente));
  if(deadlineMin===null) return {status:'neutral', label:'Sin horario definido'};
  const windowStart = deadlineMin-120;
  const now = nowMinutes();
  const row = palletsRow(cliente.id);
  if(row && row.updated_at){
    const upd = new Date(row.updated_at);
    const updMin = upd.getHours()*60+upd.getMinutes();
    if(updMin<=windowStart) return {status:'verde', label:'A tiempo (≥2h antes)'};
    if(updMin<deadlineMin) return {status:'amarillo', label:'Cargado con riesgo (<2h antes)'};
    return {status:'rojo', label:'Cargado tarde (en la hora o después)'};
  }
  if(now<windowStart) return {status:'pendiente', label:`A tiempo · carga hasta ${pad2(Math.floor(windowStart/60))}:${pad2(windowStart%60)}`};
  if(now<deadlineMin) return {status:'amarillo', label:'Urgente · sin cargar'};
  return {status:'rojo', label:'Plazo vencido · sin cargar'};
}
function ind1BadgeHtml(ind){
  const map = {verde:'green', amarillo:'amber', rojo:'red', neutral:'neutral', pendiente:'neutral'};
  return `<span class="badge ${map[ind.status]}" title="${escapeHtml(ind.label)}"><span class="dot"></span>${escapeHtml(ind.label)}</span>`;
}
function getEstadoCliente(cliente){
  const solicitado = pallets(cliente.id);
  if(solicitado===0) return {code:'sin_pallets', label:'Sin pallets solicitados', tone:'neutral'};
  const cobertura = coberturaCliente(cliente.id);
  const ps = paradasDeCliente(cliente.id);
  if(cobertura < solicitado) return {code:'pendiente', label:'Pendiente de asignar', tone:'red'};
  const todasEntregadas = ps.length>0 && ps.every(p=>p.estado_parada==='entregado');
  if(todasEntregadas) return {code:'entregado', label:'Retirado', tone:'green'};
  return {code:'en_curso', label:'Camión en camino', tone:'amber'};
}
function statusBadgeHtml(st){ return `<span class="badge ${st.tone}"><span class="dot"></span>${escapeHtml(st.label)}</span>`; }

async function setPallets(clienteId, cantidad, actor){
  cantidad = Math.max(0, cantidad);
  const {error} = await sb.from('retiro_pallets_dia').upsert({
    cliente_id: clienteId, fecha: hoyISO(), cantidad, updated_by_area: actor, updated_at: new Date().toISOString()
  });
  if(error){ showToast('No se pudo guardar: '+error.message); return; }
  const c = clienteMap()[clienteId];
  logEvento(`<b>${actor}</b> actualizó pallets de <b>${escapeHtml(c?c.nombre:clienteId)}</b> a ${cantidad}`);
  await cargarTodo();
}
async function setVehiculoEstado(patente, estado, motivo){
  const {error} = await sb.from('retiro_vehiculos').update({estado_disponibilidad:estado, motivo: motivo||null, updated_at:new Date().toISOString()}).eq('patente', patente);
  if(error){ showToast(error.message); return; }
  logEvento(`Flota: <b>${patente}</b> → ${ESTADO_VEHICULO_LABEL[estado]||estado}`);
  await cargarTodo();
}
async function iniciarViaje(patente, clienteId){
  const vehiculo = vehiculoMap()[patente];
  const solicitado = pallets(clienteId);
  const cobertura = coberturaCliente(clienteId);
  const pendiente = Math.max(0, solicitado - cobertura);
  if(pendiente<=0){ showToast('Este cliente ya está cubierto'); return; }
  const cantidad = Math.min(pendiente, vehiculo.capacidad_pallets);
  const numeroViaje = viajesDePatente(patente).length + 1;
  const {data:viaje, error} = await sb.from('retiro_viajes').insert({patente, fecha:hoyISO(), numero_viaje:numeroViaje, origen:'manual'}).select().single();
  if(error){ showToast('Error al crear viaje: '+error.message); return; }
  const {error:e2} = await sb.from('retiro_viaje_paradas').insert({viaje_id:viaje.id, cliente_id:clienteId, cantidad_pallets:cantidad, orden:1});
  if(e2){ showToast('Error al asignar cliente: '+e2.message); return; }
  const c = clienteMap()[clienteId];
  logEvento(`Operaciones asignó <b>${patente}</b> a <b>${escapeHtml(c?c.nombre:clienteId)}</b> (viaje #${numeroViaje}, ${cantidad} plt)`);
  await cargarTodo();
}
async function agregarParadaAlViaje(viajeId, clienteId, cantidad){
  const viaje = state.viajes.find(v=>v.id===viajeId);
  const vehiculo = vehiculoMap()[viaje.patente];
  const usada = capacidadUsada(viaje);
  if(usada + cantidad > vehiculo.capacidad_pallets){ showToast(`Excede capacidad del viaje: ${usada+cantidad}/${vehiculo.capacidad_pallets} plt`); return; }
  if(cantidad<=0){ showToast('Cantidad inválida'); return; }
  const orden = paradasDe(viajeId).length + 1;
  const {error} = await sb.from('retiro_viaje_paradas').insert({viaje_id:viajeId, cliente_id:clienteId, cantidad_pallets:cantidad, orden});
  if(error){ showToast(error.message); return; }
  const c = clienteMap()[clienteId];
  logEvento(`Se sumó <b>${escapeHtml(c?c.nombre:clienteId)}</b> al viaje en curso de <b>${viaje.patente}</b>`);
  await cargarTodo();
}
async function simularLlegada(paradaId){
  const {error} = await sb.from('retiro_viaje_paradas').update({estado_parada:'entregado', hora_llegada:new Date().toISOString()}).eq('id', paradaId);
  if(error){ showToast(error.message); return; }
  const parada = state.paradas.find(p=>p.id===paradaId);
  const c = clienteMap()[parada.cliente_id];
  logEvento(`GPS simulado: llegada a <b>${escapeHtml(c?c.nombre:parada.cliente_id)}</b>`);
  await cargarTodo();
}
async function simularRegresoBase(viajeId){
  const viaje = state.viajes.find(v=>v.id===viajeId);
  const pend = paradasDe(viajeId).filter(p=>p.estado_parada!=='entregado');
  if(pend.length){ showToast('Aún hay clientes sin entrega marcada en este viaje'); return; }
  const {error} = await sb.from('retiro_viajes').update({estado:'completado', hora_regreso_base:new Date().toISOString()}).eq('id', viajeId);
  if(error){ showToast(error.message); return; }
  logEvento(`GPS simulado: <b>${viaje.patente}</b> descargó en base — disponible para nuevo viaje`);
  await cargarTodo();
}
async function reiniciarDia(){
  if(!confirm('Esto borra TODOS los viajes y pallets cargados HOY (los 64 clientes y 36 vehículos). Pensado para pruebas antes de operar en producción. ¿Continuar?')) return;
  const fecha = hoyISO();
  await sb.from('retiro_pallets_dia').delete().eq('fecha', fecha);
  const ids = state.viajes.map(v=>v.id);
  if(ids.length){
    await sb.from('retiro_viaje_paradas').delete().in('viaje_id', ids);
    await sb.from('retiro_viajes').delete().in('id', ids);
  }
  liveEventLog = [];
  logEvento('Día reiniciado (modo prueba)');
  await cargarTodo();
}

/* ============================= RESUMEN ============================= */
function viewResumen(){
  const solicitadoHoy = state.pallets.reduce((s,p)=>s+p.cantidad,0);
  const enViaje = state.vehiculos.filter(v=>viajeActivoDe(v.patente)).length;
  const noDisponibles = state.vehiculos.filter(v=>v.estado_disponibilidad!=='Disponible').length;
  const disponiblesLibres = state.vehiculos.length - enViaje - noDisponibles;
  const viajesHoy = state.viajes.length;
  const viajesCompletados = state.viajes.filter(v=>v.estado==='completado').length;
  const estados = state.clientes.map(c=>({c, st:getEstadoCliente(c)}));
  const pendientes = estados.filter(x=>x.st.code==='pendiente');
  const enCurso = estados.filter(x=>x.st.code==='en_curso').length;
  const entregados = estados.filter(x=>x.st.code==='entregado').length;

  function ind1Agg(area){
    const rel = state.pallets.filter(p=>p.updated_by_area===area);
    const total = rel.length;
    let verde=0, amarillo=0, rojo=0;
    rel.forEach(p=>{
      const c = clienteMap()[p.cliente_id]; if(!c) return;
      const st = getIndicator1(c).status;
      if(st==='verde') verde++; else if(st==='amarillo') amarillo++; else if(st==='rojo') rojo++;
    });
    return {total, verde, amarillo, rojo};
  }
  function ind1Bar(agg){
    if(agg.total===0) return `<div class="empty" style="padding:14px;">Sin registros de carga hoy</div>`;
    const pv=Math.round(agg.verde/agg.total*100), pa=Math.round(agg.amarillo/agg.total*100), pr=100-pv-pa;
    return `<div style="display:flex; height:10px; border-radius:6px; overflow:hidden; margin:8px 0 6px; border:1px solid var(--line);">
      <div style="width:${pv}%; background:var(--green);"></div><div style="width:${pa}%; background:var(--amber);"></div><div style="width:${pr}%; background:var(--red);"></div>
      </div>
      <div style="display:flex; gap:14px; font-size:11.5px; color:var(--ink-soft); flex-wrap:wrap;">
        <span>${agg.verde} verde</span><span>${agg.amarillo} amarillo</span><span>${agg.rojo} rojo</span>
        <span style="margin-left:auto; color:var(--ink-faint);">${agg.total} cargados hoy</span>
      </div>`;
  }
  const sac = ind1Agg('SAC'), ih = ind1Agg('In House');

  const rank = {rojo:0, amarillo:1, pendiente:2, neutral:3};
  const atencion = pendientes.slice().sort((a,b)=>(rank[getIndicator1(a.c).status]??9)-(rank[getIndicator1(b.c).status]??9));

  return `
    <div class="page-head">
      <h1>Resumen</h1>
      <p>Estado consolidado del control de retiros diarios — datos en vivo, compartidos entre SAC, In House y Operaciones.</p>
    </div>
    <div class="grid-kpi">
      <div class="card kpi"><div class="num">${solicitadoHoy}</div><div class="lbl">Pallets solicitados hoy</div></div>
      <div class="card kpi ok"><div class="num">${disponiblesLibres}</div><div class="lbl">Camiones disponibles</div></div>
      <div class="card kpi warn"><div class="num">${enViaje}</div><div class="lbl">Camiones en viaje</div></div>
      <div class="card kpi ${pendientes.length?'crit':'ok'}"><div class="num">${pendientes.length}</div><div class="lbl">Clientes sin cobertura</div></div>
    </div>
    <p class="kpi-foot">${noDisponibles} camión(es) no disponible(s) por mantención/falla · ${viajesHoy} viaje(s) hoy (${viajesCompletados} completados)</p>

    <div class="section-title"><h2>Requiere acción ahora (${atencion.length})</h2></div>
    ${atencion.length ? `<div class="accion-list">${atencion.map(({c})=>{
      const cob = coberturaCliente(c.id);
      return `<div class="card accion-item">
        <div class="accion-top"><b>${escapeHtml(c.nombre)}</b>${ind1BadgeHtml(getIndicator1(c))}</div>
        <div class="accion-sub">${c.turno} · ${escapeHtml(horarioTextoHoy(c)||'sin horario')} · <span class="mono">${cob} de ${pallets(c.id)} pallets cubiertos</span></div>
      </div>`;
    }).join('')}</div>` : `<div class="card empty" style="padding:18px; margin-bottom:12px;">Todo en orden: los clientes con pallets solicitados están cubiertos.</div>`}

    <details class="card ind-card">
      <summary>Indicador 1 · Anticipación de carga <span class="ind-sum">SAC ${sac.rojo+sac.amarillo} alertas · In House ${ih.rojo+ih.amarillo} alertas</span></summary>
      <p style="color:var(--ink-soft); font-size:12px; margin:8px 0 12px;">Meta: dato cargado ≥2h antes del horario de retiro. Solo SAC e In House (Operaciones excluida).</p>
      <div class="ind-grid">
        <div><b>SAC</b>${ind1Bar(sac)}</div>
        <div><b>In House</b>${ind1Bar(ih)}</div>
      </div>
      <p class="section-note" style="margin:14px 0 0;">Indicador 2 (cumplimiento de horario) bloqueado hasta tener GPS real; solo red interna. Hoy: ${enCurso} viaje(s) en curso, ${entregados} entregado(s).</p>
    </details>
  `;
}

/* ============================= CARGA DE PALLETS ============================= */
function viewCarga(){
  let list = state.clientes.map(c=>({c, ind:getIndicator1(c)}));
  if(cargaFilter.turno!=='todos') list = list.filter(x=>x.c.turno===cargaFilter.turno);
  if(cargaFilter.q) list = list.filter(x=>x.c.nombre.toLowerCase().includes(cargaFilter.q.toLowerCase()));
  if(cargaFilter.estado==='sin-cargar') list = list.filter(x=>!palletsRow(x.c.id));
  if(cargaFilter.estado==='urgente') list = list.filter(x=>!palletsRow(x.c.id) && (x.ind.status==='amarillo'||x.ind.status==='rojo'));
  if(cargaFilter.estado==='cargado') list = list.filter(x=>!!palletsRow(x.c.id));
  const rank = {rojo:0, amarillo:1, pendiente:2, neutral:3, verde:4};
  list.sort((a,b)=>(rank[a.ind.status]??9)-(rank[b.ind.status]??9));

  const cargados = state.clientes.filter(c=>palletsRow(c.id)).length;
  const urgentes = state.clientes.filter(c=>!palletsRow(c.id) && getIndicator1(c).status==='amarillo').length;
  const atrasados = state.clientes.filter(c=>!palletsRow(c.id) && getIndicator1(c).status==='rojo').length;

  return `
    <div class="page-head">
      <h1>Carga de Pallets</h1>
      <p>Ingreso de cantidad de pallets a retirar por cliente. SAC, In House y Operaciones usan el mismo formulario — el dato es mutable durante el día y el último valor guardado es el vigente.</p>
      <div class="role-line"><span class="pill">Ingresando como</span>
        <div class="chipset">${['SAC','In House','Operaciones'].map(a=>`<button data-actor="${a}" class="${cargaActor===a?'active':''}">${a}</button>`).join('')}</div>
      </div>
    </div>
    <div class="summary-bar">
      <div class="summary-chip"><span class="n">${state.clientes.length}</span><span class="l">Clientes totales</span></div>
      <div class="summary-chip"><span class="n" style="color:var(--green);">${cargados}</span><span class="l">Cargados hoy</span></div>
      <div class="summary-chip"><span class="n" style="color:var(--amber);">${urgentes}</span><span class="l">Urgentes (&lt;2h)</span></div>
      <div class="summary-chip"><span class="n" style="color:var(--red);">${atrasados}</span><span class="l">Atrasados / sin cargar</span></div>
    </div>
    <div class="toolbar">
      <div class="search"><input id="cargaSearch" placeholder="Buscar cliente…" value="${escapeHtml(cargaFilter.q)}"></div>
      <div class="chipset" id="cargaTurnoFilter">${['todos','AM','PM'].map(t=>`<button data-t="${t}" class="${cargaFilter.turno===t?'active':''}">${t==='todos'?'Todos':t}</button>`).join('')}</div>
      <div class="chipset" id="cargaEstadoFilter">${[['todos','Todo estado'],['sin-cargar','Sin cargar'],['urgente','Urgente/atrasado'],['cargado','Cargado']].map(([k,l])=>`<button data-e="${k}" class="${cargaFilter.estado===k?'active':''}">${l}</button>`).join('')}</div>
    </div>
    <div class="client-grid">
      ${list.length ? list.map(({c,ind})=>cargaCard(c,ind)).join('') : `<div class="empty" style="grid-column:1/-1;">Sin resultados.</div>`}
    </div>
  `;
}
function cargaCard(c, ind){
  const row = palletsRow(c.id);
  const val = row ? row.cantidad : 0;
  return `<div class="card ccard" data-carga-card="${c.id}">
    <div class="ccard-top"><div><div class="ccard-name">${escapeHtml(c.nombre)}</div><div class="ccard-meta">${c.turno} · ${escapeHtml(c.ruta_ref||'ref. ruta —')}</div></div>${ind1BadgeHtml(ind)}</div>
    <div class="ccard-row">
      <div class="ccard-time">${escapeHtml(horarioTextoHoy(c)||'—')}</div>
      <div class="stepper">
        <button data-act="dec" data-id="${c.id}">−</button>
        <span class="val" id="carga-val-${c.id}" data-current="${val}">${val}</span>
        <button data-act="inc" data-id="${c.id}">+</button>
      </div>
    </div>
    <div class="ccard-row">
      <span style="font-size:11px; color:var(--ink-faint);">${row ? `Últ. carga ${fmtTime(row.updated_at)} · ${escapeHtml(row.updated_by_area||'')}` : 'Aún sin cargar hoy'}</span>
      <button class="btn small primary" data-act="guardar" data-id="${c.id}">Guardar</button>
    </div>
  </div>`;
}

/* ============================= DISPONIBILIDAD DE FLOTA ============================= */
function viewFlota(){
  const rows = state.vehiculos.slice().sort((a,b)=>a.patente.localeCompare(b.patente)).map(v=>{
    const viaje = viajeActivoDe(v.patente);
    const nViajes = viajesDePatente(v.patente).length;
    let estadoBadge;
    if(v.estado_disponibilidad!=='Disponible') estadoBadge = statusBadgeHtml({tone:'neutral', label:ESTADO_VEHICULO_LABEL[v.estado_disponibilidad]});
    else if(viaje) estadoBadge = statusBadgeHtml({tone:'amber', label:'En viaje'});
    else estadoBadge = statusBadgeHtml({tone:'green', label:'Disponible'});
    return `<tr>
      <td class="mono">${v.patente}</td>
      <td>${v.categoria}</td>
      <td class="mono">${v.capacidad_pallets} plt</td>
      <td class="mono">${nViajes} hoy</td>
      <td>
        <select data-patente="${v.patente}" class="estado-select" ${v.bloqueado_por_taller?'disabled title="Bloqueado por Taller (NTFleet)"':(!puedeAsignarFlota()?'disabled title="Solo lectura"':'')}>
          ${v.bloqueado_por_taller?`<option selected>${ESTADO_VEHICULO_LABEL[v.estado_disponibilidad]}</option>`:ESTADOS_VEHICULO.map(e=>`<option value="${e}" ${v.estado_disponibilidad===e?'selected':''}>${ESTADO_VEHICULO_LABEL[e]}</option>`).join('')}
        </select>
      </td>
      <td><input type="text" data-patente="${v.patente}" class="motivo-input" placeholder="Motivo (opcional)" ${(v.bloqueado_por_taller||!puedeAsignarFlota())?'disabled':''} value="${escapeHtml(v.motivo||'')}" style="width:170px;"></td>
      <td>${estadoBadge}</td>
    </tr>`;
  }).join('');
  return `
    <div class="page-head">
      <h1>Disponibilidad de Flota</h1>
      <p>Chequeo de disponibilidad MACRO del día (mantención, falla, viaje a otra operación) — hoy la determina Operaciones; las unidades en taller o inactivas en NTFleet se bloquean automáticamente y no se pueden editar aquí. Distinto del estado dinámico "en viaje" de la pestaña Camiones y Viajes.</p>
    </div>
    <div class="section-note"><b>${state.vehiculos.length} unidades</b> — ${state.vehiculos.filter(v=>v.categoria==='Camion').length} Camiones + ${state.vehiculos.filter(v=>v.categoria==='Rampla').length} Ramplas. El chequeo debe hacerse el mismo día, antes de asignar viajes.</div>
    <div class="table-wrap flota-table">
      <table><thead><tr><th>Patente</th><th>Categoría</th><th>Capacidad</th><th>Viajes hoy</th><th>Estado del día</th><th>Motivo</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>
  `;
}

/* ============================= CAMIONES Y VIAJES ============================= */
function viewViajes(){
  const vehiculosOrdenados = state.vehiculos.slice().sort((a,b)=>{
    const va = viajeActivoDe(a.patente), vb = viajeActivoDe(b.patente);
    const rank = v => v.estado_disponibilidad!=='Disponible' ? 2 : (viajeActivoDe(v.patente) ? 0 : 1);
    return rank(a)-rank(b) || a.patente.localeCompare(b.patente);
  });
  return `
    <div class="page-head">
      <h1>Camiones y Viajes</h1>
      <p>Un camión puede hacer varias vueltas al día y visitar varios clientes en un mismo viaje. Al descargar en la base, queda libre para un nuevo viaje. La consulta GPS será solo desde la red interna de Newtrans (decisión 08-09-2026) — quien use esta pestaña desde fuera de la red sigue confirmando llegada y regreso a base con los botones "Simular llegada" / "Simular regreso a base".</p>
      <div class="role-line">${puedeAdministrar() ? `<button class="btn ghost" id="btnReiniciarDia" title="Borra pallets y viajes de HOY para volver a probar">Reiniciar día (modo prueba)</button>` : ''}</div>
    </div>
    <div class="grid" style="display:grid; grid-template-columns:1.4fr 1fr; gap:16px; align-items:start;">
      <div id="camionesList">${vehiculosOrdenados.map(truckCard).join('')}</div>
      <section class="card">
        <div style="padding:12px 16px; border-bottom:1px solid var(--line); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);">Bitácora del día</div>
        <div style="padding:12px 16px; max-height:640px; overflow-y:auto;" id="timeline">${timelineHtml()}</div>
      </section>
    </div>
  `;
}
function timelineHtml(){
  if(!liveEventLog.length) return `<div class="empty">Aún no hay eventos. Carga pallets o asigna un camión para empezar.</div>`;
  return `<div class="timeline">${liveEventLog.map(e=>`<div class="tl-item"><span class="ts">${fmtTime(e.ts)}</span><span>${e.msg}</span></div>`).join('')}</div>`;
}
function truckCard(v){
  if(v.estado_disponibilidad!=='Disponible'){
    return `<div class="truck-card nodisp">
      <div class="truck-head"><span class="patente">${v.patente}</span>${statusBadgeHtml({tone:'neutral', label:ESTADO_VEHICULO_LABEL[v.estado_disponibilidad]})}</div>
      <div class="truck-cap">${v.categoria} · cap. ${v.capacidad_pallets} plt${v.motivo?` · ${escapeHtml(v.motivo)}`:''}</div>
    </div>`;
  }
  const viaje = viajeActivoDe(v.patente);
  const nViajes = viajesDePatente(v.patente).length;
  if(viaje){
    const usada = capacidadUsada(viaje);
    const pct = Math.min(100, Math.round(usada/v.capacidad_pallets*100));
    const over = usada > v.capacidad_pallets;
    const paradas = paradasDe(viaje.id);
    const enViajeYaIds = paradas.map(p=>p.cliente_id);
    const pendientesParaSumar = state.clientes.filter(c => !enViajeYaIds.includes(c.id) && (pallets(c.id) - coberturaCliente(c.id)) > 0);
    return `<div class="truck-card enviaje">
      <div class="truck-head"><span class="patente">${v.patente}</span><span class="badge amber"><span class="dot"></span>En viaje #${viaje.numero_viaje}</span></div>
      <div class="truck-cap">${v.categoria} · cap. ${v.capacidad_pallets} plt · ${nViajes} viaje(s) hoy</div>
      <div class="capbar${over?' over':''}"><div style="width:${pct}%"></div></div>
      <div class="truck-cap">${usada}/${v.capacidad_pallets} plt asignados en este viaje</div>
      <div class="stop-list">
        ${paradas.map(p=>{
          const c = clienteMap()[p.cliente_id];
          return `<div class="stop"><span class="stop-state ${p.estado_parada}"></span><span style="flex:1;">${escapeHtml(c?c.nombre:p.cliente_id)} — ${p.cantidad_pallets} plt</span>
            ${p.estado_parada!=='entregado' ? `<button class="btn small" data-act="llegada" data-pid="${p.id}">Simular llegada</button>` : `<span class="badge green">Entregado ${fmtTime(p.hora_llegada)}</span>`}
          </div>`;
        }).join('')}
      </div>
      <div class="truck-actions">
        ${pendientesParaSumar.length ? `
          <select data-act="sel-sumar" data-viaje="${viaje.id}">${pendientesParaSumar.map(c=>`<option value="${c.id}">${escapeHtml(c.nombre)} (${pallets(c.id)-coberturaCliente(c.id)} plt pend.)</option>`).join('')}</select>
          <input type="text" data-act="qty-sumar" data-viaje="${viaje.id}" value="1" style="width:46px;">
          <button class="btn small" data-act="sumar" data-viaje="${viaje.id}">+ Sumar cliente</button>
        ` : ''}
        <button class="btn small primary" data-act="regreso" data-viaje="${viaje.id}">Simular regreso a base</button>
      </div>
    </div>`;
  }
  const pendientes = state.clientes.filter(c => (pallets(c.id)-coberturaCliente(c.id))>0);
  return `<div class="truck-card disponible">
    <div class="truck-head"><span class="patente">${v.patente}</span><span class="badge green"><span class="dot"></span>Disponible</span></div>
    <div class="truck-cap">${v.categoria} · cap. ${v.capacidad_pallets} plt · ${nViajes} viaje(s) hoy</div>
    ${pendientes.length ? `
      <div class="truck-actions">
        <select data-act="sel-iniciar" data-patente="${v.patente}">${pendientes.map(c=>`<option value="${c.id}">${escapeHtml(c.nombre)} (${pallets(c.id)-coberturaCliente(c.id)} plt pend.)</option>`).join('')}</select>
        <button class="btn small primary" data-act="iniciar" data-patente="${v.patente}">Asignar y comenzar viaje</button>
      </div>` : `<div class="truck-cap">Sin pallets pendientes por asignar.</div>`}
  </div>`;
}

/* ============================= CONSULTA (solo lectura) ============================= */
function viewConsulta(){
  let list = state.clientes.map(c=>({c, st:getEstadoCliente(c)}));
  if(consultaFilter.turno!=='todos') list = list.filter(x=>x.c.turno===consultaFilter.turno);
  if(consultaFilter.estado!=='todos') list = list.filter(x=>x.st.code===consultaFilter.estado);
  if(consultaFilter.q) list = list.filter(x=>x.c.nombre.toLowerCase().includes(consultaFilter.q.toLowerCase()));

  const nEntregado = state.clientes.filter(c=>getEstadoCliente(c).code==='entregado').length;
  const nEnCurso = state.clientes.filter(c=>getEstadoCliente(c).code==='en_curso').length;
  const nPendiente = state.clientes.filter(c=>getEstadoCliente(c).code==='pendiente').length;
  const estadoFilters = [['todos','Todos'],['pendiente','Pendiente'],['en_curso','En camino'],['entregado','Retirado'],['sin_pallets','Sin pallets']];

  return `
    <div class="page-head">
      <h1>Consulta de Retiros</h1>
      <p>Vista de solo lectura para SAC / In House: estado del retiro y camión asignado por cliente, para responder al instante sin interrumpir a Operaciones.</p>
      <div class="role-line"><span class="pill readonly">Solo lectura</span></div>
    </div>
    <div class="summary-bar">
      <div class="summary-chip"><span class="n" style="color:var(--green);">${nEntregado}</span><span class="l">Retirados</span></div>
      <div class="summary-chip"><span class="n" style="color:var(--amber);">${nEnCurso}</span><span class="l">En camino</span></div>
      <div class="summary-chip"><span class="n" style="color:var(--red);">${nPendiente}</span><span class="l">Pendientes</span></div>
      <div class="summary-chip"><span class="n">${state.clientes.length}</span><span class="l">Clientes totales</span></div>
    </div>
    <div class="toolbar">
      <div class="search"><input id="consultaSearch" placeholder="Buscar cliente…" value="${escapeHtml(consultaFilter.q)}"></div>
      <div class="chipset" id="consultaTurnoFilter">${['todos','AM','PM'].map(t=>`<button data-t="${t}" class="${consultaFilter.turno===t?'active':''}">${t==='todos'?'Todos':t}</button>`).join('')}</div>
    </div>
    <div class="chipset" id="consultaEstadoFilter" style="margin-bottom:14px;">${estadoFilters.map(([k,l])=>`<button data-e="${k}" class="${consultaFilter.estado===k?'active':''}">${l}</button>`).join('')}</div>
    <div class="client-grid">
      ${list.length ? list.map(({c,st})=>consultaCard(c,st)).join('') : `<div class="empty" style="grid-column:1/-1;">Sin resultados para este filtro.</div>`}
    </div>
    <div class="footnote">La posición del camión en tiempo real (GPS) está pendiente de conectar — el estado se basa en confirmaciones de llegada/regreso registradas por Operaciones.</div>
  `;
}
function consultaCard(c, st){
  const ps = paradasDeCliente(c.id);
  let detalle = ps.length ? ps.map(p=>{
    const viaje = state.viajes.find(v=>v.id===p.viaje_id);
    return `<div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-top:1px solid var(--line-soft);">
      <span class="mono" style="font-weight:600;">${viaje?viaje.patente:'—'}</span>
      <span style="font-size:11.5px; color:var(--ink-soft);">${p.cantidad_pallets} plt · ${p.estado_parada==='entregado'?`entregado ${fmtTime(p.hora_llegada)}`:'pendiente'}</span>
    </div>`;
  }).join('') : `<div style="padding:8px 0; color:var(--ink-faint); font-size:12px;">Aún sin camión asignado.</div>`;
  return `<div class="card ccard">
    <div class="ccard-top"><div><div class="ccard-name">${escapeHtml(c.nombre)}</div><div class="ccard-meta">${c.turno} · ${escapeHtml(c.zona||'—')}</div></div>${statusBadgeHtml(st)}</div>
    <div class="ccard-time">Retiro hoy: ${escapeHtml(horarioTextoHoy(c)||'—')}</div>
    <div style="font-size:12px; color:var(--ink-soft);">${coberturaCliente(c.id)} / ${pallets(c.id)} pallets cubiertos</div>
    <div>${detalle}</div>
  </div>`;
}

/* ============================= EVENT WIRING ============================= */
function wireSection(){
  if(currentSection==='carga') wireCarga();
  else if(currentSection==='flota') wireFlota();
  else if(currentSection==='viajes') wireViajes();
  else if(currentSection==='consulta') wireConsulta();
}

function wireCarga(){
  document.querySelectorAll('[data-actor]').forEach(b=>{
    b.addEventListener('click', ()=>{ cargaActor=b.dataset.actor; try{localStorage.setItem('retiro-carga-actor',cargaActor);}catch(e){} render(); });
  });
  const search = document.getElementById('cargaSearch');
  if(search) search.addEventListener('input', ()=>{ cargaFilter.q=search.value; rerenderCarga(); });
  document.getElementById('cargaTurnoFilter').querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ cargaFilter.turno=b.dataset.t; rerenderCarga(); }));
  document.getElementById('cargaEstadoFilter').querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ cargaFilter.estado=b.dataset.e; rerenderCarga(); }));
  document.querySelectorAll('[data-act="dec"],[data-act="inc"]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const valEl = document.getElementById(`carga-val-${b.dataset.id}`);
      let cur = parseInt(valEl.dataset.current,10)||0;
      cur = Math.max(0, cur + (b.dataset.act==='inc'?1:-1));
      valEl.textContent = cur; valEl.dataset.current = cur;
    });
  });
  document.querySelectorAll('[data-act="guardar"]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const valEl = document.getElementById(`carga-val-${b.dataset.id}`);
      const cur = parseInt(valEl.dataset.current,10)||0;
      const c = clienteMap()[b.dataset.id];
      await setPallets(b.dataset.id, cur, cargaActor);
      showToast(`${c?c.nombre:''}: ${cur} pallets guardados`);
    });
  });
}
function rerenderCarga(){ document.getElementById('mainArea').innerHTML = viewCarga(); wireCarga(); }

function wireFlota(){
  document.querySelectorAll('.estado-select').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const p = sel.dataset.patente;
      const motivoInput = document.querySelector(`.motivo-input[data-patente="${p}"]`);
      await setVehiculoEstado(p, sel.value, motivoInput?motivoInput.value:'');
      showToast(`${p} → ${ESTADO_VEHICULO_LABEL[sel.value]}`);
    });
  });
  document.querySelectorAll('.motivo-input').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const p = inp.dataset.patente;
      const sel = document.querySelector(`.estado-select[data-patente="${p}"]`);
      await setVehiculoEstado(p, sel.value, inp.value);
      showToast('Motivo actualizado');
    });
  });
}

function wireViajes(){
  const btnReset = document.getElementById('btnReiniciarDia');
  if(btnReset) btnReset.addEventListener('click', reiniciarDia);
  document.querySelectorAll('[data-act="llegada"]').forEach(b=>{
    b.addEventListener('click', ()=>simularLlegada(b.dataset.pid));
  });
  document.querySelectorAll('[data-act="regreso"]').forEach(b=>{
    b.addEventListener('click', ()=>simularRegresoBase(b.dataset.viaje));
  });
  document.querySelectorAll('[data-act="iniciar"]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const sel = document.querySelector(`[data-act="sel-iniciar"][data-patente="${b.dataset.patente}"]`);
      if(!sel || !sel.value) return;
      iniciarViaje(b.dataset.patente, sel.value);
    });
  });
  document.querySelectorAll('[data-act="sumar"]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const sel = document.querySelector(`[data-act="sel-sumar"][data-viaje="${b.dataset.viaje}"]`);
      const qty = document.querySelector(`[data-act="qty-sumar"][data-viaje="${b.dataset.viaje}"]`);
      const q = parseInt(qty?qty.value:'0',10)||0;
      if(!sel || !sel.value || q<=0) return;
      agregarParadaAlViaje(b.dataset.viaje, sel.value, q);
    });
  });
}

function wireConsulta(){
  const search = document.getElementById('consultaSearch');
  if(search) search.addEventListener('input', ()=>{ consultaFilter.q=search.value; rerenderConsulta(); });
  document.getElementById('consultaTurnoFilter').querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ consultaFilter.turno=b.dataset.t; rerenderConsulta(); }));
  document.getElementById('consultaEstadoFilter').querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ consultaFilter.estado=b.dataset.e; rerenderConsulta(); }));
}
function rerenderConsulta(){ document.getElementById('mainArea').innerHTML = viewConsulta(); wireConsulta(); }

/* ============================= INIT ============================= */
document.addEventListener('DOMContentLoaded', ()=>{
  initTheme();
  wireLogin();
  tickClock();
  setInterval(tickClock, 1000);
  initAuth();
});
})();
</script>

</body></html>
